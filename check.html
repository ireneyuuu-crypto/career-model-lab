<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Model Lab 数据自检</title><style>body{font-family:system-ui,'Microsoft YaHei',sans-serif;max-width:780px;margin:8vh auto;padding:20px;color:#655c59;background:#fffdfb}h1{font-size:28px}button{background:#786c66;color:white;border:0;padding:14px 25px;border-radius:30px;cursor:pointer}pre{background:#f7f4f2;padding:20px;white-space:pre-wrap;word-break:break-all;border-radius:15px;line-height:1.7}.ok{color:#2a7864}.bad{color:#b04d49}</style></head><body><h1>Career Model Lab · 数据自检</h1><p>点击检查，直接测试 GitHub Pages 能否读取仓库根目录和 data 文件夹内的星历文件。不会上传任何出生资料。</p><button id="go">检查数据文件</button><pre id="out">尚未开始检查</pre><script>document.getElementById('go').addEventListener('click',async()=>{const o=document.getElementById('out');o.textContent='检查中…';let lines=[];for(const path of ['./1992.json','./data/1992.json','./2027.json','./data/2027.json','./engine.js']){let url=new URL(path,location.href);try{let r=await fetch(url,{cache:'no-store'});let type=r.headers.get('content-type')||'无';let info=`${path} → HTTP ${r.status}, ${type}`;if(r.ok&&path.endsWith('.json')){try{let j=await r.json();info+=`，JSON ${Array.isArray(j)?'数组 '+j.length+' 条':'非数组'}`}catch(e){info+='，JSON 无法解析'}}lines.push(info)}catch(e){lines.push(`${path} → 网络错误：${e.message}`)}}o.textContent=`本页地址：${location.href}\n\n`+lines.join('\n')+'\n\n请截图这一整段结果发给我。';});</script></body></html>
